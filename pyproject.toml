[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfit-agent"
version = "1.1.0"
description = "An evidence-grounded AI agent for job matching and resume diagnosis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.40,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "openai>=1.50,<3",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
markers = ["live_api: explicitly enabled tests that may access a real API"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".agents", ".venv", ".verify-venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
